services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:////app/data/compra_juegos.db
      ENVIRONMENT: test
      SECRET_KEY: e2e-only-not-a-production-secret
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: e2e-only-admin-password
      CORS_ORIGINS: http://localhost:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    volumes:
      - e2e-store-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  e2e-store-data:
