name: CompraJuegos CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Pruebas y build
    runs-on: ubuntu-latest
    outputs:
      backend_tests: ${{ steps.backend_tests.outcome }}
      frontend_build: ${{ steps.frontend_build.outcome }}
      test_stack: ${{ steps.test_stack.outcome }}
      playwright_tests: ${{ steps.playwright_tests.outcome }}
      test_stack_cleanup: ${{ steps.test_stack_cleanup.outcome }}
    env:
      DATABASE_URL: sqlite:////tmp/compra-juegos-tests.db
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            e2e/requirements.txt

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install -r e2e/requirements.txt
          npm ci
          mkdir -p test-results

      - name: Pruebas pytest del backend
        id: backend_tests
        working-directory: backend
        run: python -m pytest -q tests --junitxml=../test-results/backend.xml

      - name: Build de Angular
        id: frontend_build
        run: npm run build

      - name: Guardar frontend probado para despliegue
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/compra-juegos/browser
          if-no-files-found: error

      - name: Instalar navegador Playwright
        run: python -m playwright install --with-deps chromium

      - name: Iniciar entorno de pruebas
        id: test_stack
        run: docker compose -f compose.e2e.yaml up --build -d

      - name: Esperar a que la aplicación responda
        if: steps.test_stack.outcome == 'success'
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f compose.e2e.yaml logs
          exit 1

      - name: Pruebas Playwright end-to-end
        id: playwright_tests
        if: steps.test_stack.outcome == 'success'
        timeout-minutes: 15
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_ADMIN_EMAIL: admin@example.com
          E2E_ADMIN_PASSWORD: e2e-only-admin-password
        run: |
          python -m pytest -q -s e2e/test_store.py --junitxml=test-results/playwright-store.xml
          python -m pytest -q -s -n 4 e2e/test_ui_matrix.py --junitxml=test-results/playwright-matrix.xml

      - name: Detener entorno de pruebas
        id: test_stack_cleanup
        if: always()
        run: docker compose -f compose.e2e.yaml down --volumes --remove-orphans

      - name: Guardar resultados XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: test-results/*.xml
          if-no-files-found: ignore

  deploy:
    name: Desplegar en EC2
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.tests.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Descargar frontend probado
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: deployment-dist

      - name: Verificar secretos de EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          for name in EC2_HOST EC2_USER EC2_SSH_KEY EC2_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "Falta configurar el secreto $name."
              exit 1
            fi
          done

      - name: Preparar acceso SSH verificado
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Empaquetar versión probada
        run: |
          git archive --format=tar HEAD | gzip -n > compra-juegos.tar.gz
          mkdir -p deployment-context/dist/compra-juegos/browser
          cp -R deployment-dist/. deployment-context/dist/compra-juegos/browser/
          tar -czf frontend-dist.tar.gz -C deployment-context dist

      - name: Actualizar contenedores en EC2
        id: deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ vars.EC2_APP_DIR || '/opt/compra-juegos' }}
        run: |
          case "$EC2_APP_DIR" in
            /*) ;;
            *) echo "EC2_APP_DIR debe ser una ruta absoluta."; exit 1 ;;
          esac
          target="$EC2_USER@$EC2_HOST"
          ssh "$target" "mkdir -p '$EC2_APP_DIR/releases'"
          scp compra-juegos.tar.gz "$target:$EC2_APP_DIR/release-$GITHUB_SHA.tar.gz"
          scp frontend-dist.tar.gz "$target:$EC2_APP_DIR/frontend-$GITHUB_SHA.tar.gz"
          ssh "$target" bash -s -- "$EC2_APP_DIR" "$GITHUB_SHA" <<'REMOTE'
          set -eu
          app_dir=$1
          release_sha=$2
          release="$app_dir/releases/$release_sha"
          mkdir -p "$release"
          tar -xzf "$app_dir/release-$release_sha.tar.gz" -C "$release"
          tar -xzf "$app_dir/frontend-$release_sha.tar.gz" -C "$release"
          rm "$app_dir/release-$release_sha.tar.gz"
          rm "$app_dir/frontend-$release_sha.tar.gz"
          cd "$app_dir"
          compose=(docker compose --project-name compra-juegos --env-file "$app_dir/.env" --file "$release/compose.yaml")
          "${compose[@]}" pull caddy openobserve otel-collector web
          legacy_containers=(api-proxy api-blue api-green webapp-container)
          stopped_containers=()
          restore_legacy() {
            if [ "${#stopped_containers[@]}" -eq 0 ]; then return; fi
            if ! "${compose[@]}" down; then
              echo "No se pudo detener la nueva pila durante la restauración." >&2
            fi
            for container in "${stopped_containers[@]}"; do
              if ! docker start "$container"; then
                echo "No se pudo restaurar el contenedor previo $container." >&2
              fi
            done
          }
          for container in "${legacy_containers[@]}"; do
            if docker inspect "$container" >/dev/null 2>&1 && [ "$(docker inspect -f '{{.State.Running}}' "$container")" = true ]; then
              if ! docker stop "$container"; then
                restore_legacy
                exit 1
              fi
              stopped_containers+=("$container")
            fi
          done
          if ! "${compose[@]}" build api; then
            restore_legacy
            exit 1
          fi
          if ! "${compose[@]}" up -d --no-build --remove-orphans; then
            if ! "${compose[@]}" logs; then
              echo "No se pudieron leer los logs de Compose." >&2
            fi
            restore_legacy
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if "${compose[@]}" exec -T api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          if ! "${compose[@]}" logs; then
            echo "No se pudieron leer los logs de Compose." >&2
          fi
          restore_legacy
          exit 1
          REMOTE

      - name: Verificar HTTPS público
        id: public_https
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 10 https://tienda-videojuegos.duckdns.org/api/health >/dev/null &&
              curl --fail --silent --max-time 10 https://obs-videojuegos.duckdns.org/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "No se pudieron validar ambos dominios por HTTPS." >&2
          exit 1

      - name: Restaurar servicios anteriores si falla HTTPS
        if: steps.public_https.outcome == 'failure'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ vars.EC2_APP_DIR || '/opt/compra-juegos' }}
        run: |
          ssh "$EC2_USER@$EC2_HOST" bash -s -- "$EC2_APP_DIR" "$GITHUB_SHA" <<'REMOTE'
          set -eu
          app_dir=$1
          release_sha=$2
          release="$app_dir/releases/$release_sha"
          compose=(docker compose --project-name compra-juegos --env-file "$app_dir/.env" --file "$release/compose.yaml")
          if ! "${compose[@]}" down; then
            echo "No se pudo detener la nueva pila antes de restaurar." >&2
          fi
          failed=false
          for container in api-proxy api-blue api-green webapp-container; do
            if docker inspect "$container" >/dev/null 2>&1 && [ "$(docker inspect -f '{{.State.Running}}' "$container")" = false ]; then
              if ! docker start "$container"; then
                echo "No se pudo restaurar el contenedor previo $container." >&2
                failed=true
              fi
            fi
          done
          if [ "$failed" = true ]; then exit 1; fi
          REMOTE

      - name: Registrar resultado de pruebas en OpenObserve
        if: always()
        env:
          OPENOBSERVE_URL: ${{ secrets.OPENOBSERVE_URL }}
          OPENOBSERVE_EMAIL: ${{ secrets.OPENOBSERVE_EMAIL }}
          OPENOBSERVE_PASSWORD: ${{ secrets.OPENOBSERVE_PASSWORD }}
          OPENOBSERVE_ORG: ${{ vars.OPENOBSERVE_ORG || 'default' }}
          OPENOBSERVE_STREAM: ${{ vars.OPENOBSERVE_STREAM || 'ci_cd' }}
        run: |
          python scripts/report_pipeline.py \
            --event test_run \
            --outcome "${{ needs.tests.outputs.backend_tests }}" \
            --outcome "${{ needs.tests.outputs.frontend_build }}" \
            --outcome "${{ needs.tests.outputs.test_stack }}" \
            --outcome "${{ needs.tests.outputs.playwright_tests }}" \
            --outcome "${{ needs.tests.outputs.test_stack_cleanup }}"

      - name: Registrar despliegue en OpenObserve
        if: always()
        env:
          OPENOBSERVE_URL: ${{ secrets.OPENOBSERVE_URL }}
          OPENOBSERVE_EMAIL: ${{ secrets.OPENOBSERVE_EMAIL }}
          OPENOBSERVE_PASSWORD: ${{ secrets.OPENOBSERVE_PASSWORD }}
          OPENOBSERVE_ORG: ${{ vars.OPENOBSERVE_ORG || 'default' }}
          OPENOBSERVE_STREAM: ${{ vars.OPENOBSERVE_STREAM || 'ci_cd' }}
        run: |
          python scripts/report_pipeline.py \
            --event deployment \
            --outcome "${{ needs.tests.result }}" \
            --outcome "${{ steps.deployment.outcome }}"

  report-failed-tests:
    name: Registrar pruebas fallidas en OpenObserve
    needs: tests
    if: github.event_name != 'pull_request' && needs.tests.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Registrar resultado de pruebas
        env:
          OPENOBSERVE_URL: ${{ secrets.OPENOBSERVE_URL }}
          OPENOBSERVE_EMAIL: ${{ secrets.OPENOBSERVE_EMAIL }}
          OPENOBSERVE_PASSWORD: ${{ secrets.OPENOBSERVE_PASSWORD }}
          OPENOBSERVE_ORG: ${{ vars.OPENOBSERVE_ORG || 'default' }}
          OPENOBSERVE_STREAM: ${{ vars.OPENOBSERVE_STREAM || 'ci_cd' }}
        run: |
          python scripts/report_pipeline.py \
            --event test_run \
            --outcome "${{ needs.tests.result }}"
