name: CompraJuegos CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Pruebas y build
    runs-on: ubuntu-latest
    outputs:
      reporter_tests: ${{ steps.reporter_tests.outcome }}
      backend_tests: ${{ steps.backend_tests.outcome }}
      frontend_build: ${{ steps.frontend_build.outcome }}
      test_stack: ${{ steps.test_stack.outcome }}
      playwright_tests: ${{ steps.playwright_tests.outcome }}
      test_stack_cleanup: ${{ steps.test_stack_cleanup.outcome }}
    env:
      DATABASE_URL: sqlite:////tmp/compra-juegos-tests.db
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            e2e/requirements.txt

      - name: Probar el reportero de OpenObserve
        id: reporter_tests
        run: python -m unittest scripts.test_report_pipeline scripts.test_cpu_temp_estimator

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install -r e2e/requirements.txt
          npm ci
          mkdir -p test-results
          mkdir -p junit-reports

      - name: Pruebas pytest del backend
        id: backend_tests
        working-directory: backend
        run: python -m pytest -v tests --junitxml=../junit-reports/backend.xml

      - name: Build de Angular
        id: frontend_build
        run: npm run build

      - name: Guardar frontend probado para despliegue
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/compra-juegos/browser
          if-no-files-found: error

      - name: Instalar navegador Playwright
        run: python -m playwright install --with-deps chromium

      - name: Iniciar entorno de pruebas
        id: test_stack
        run: docker compose -f compose.e2e.yaml up --build -d

      - name: Esperar a que la aplicación responda
        if: steps.test_stack.outcome == 'success'
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f compose.e2e.yaml logs
          exit 1

      - name: Pruebas Playwright end-to-end
        id: playwright_tests
        if: steps.test_stack.outcome == 'success'
        timeout-minutes: 15
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_ADMIN_EMAIL: admin@example.com
          E2E_ADMIN_PASSWORD: e2e-only-admin-password
        run: |
          python -m pytest -v -s e2e/test_store.py --junitxml=junit-reports/playwright-store.xml
          python -m pytest -v -s -n 4 e2e/test_ui_matrix.py --junitxml=junit-reports/playwright-matrix.xml

      - name: Detener entorno de pruebas
        id: test_stack_cleanup
        if: always()
        run: docker compose -f compose.e2e.yaml down --volumes --remove-orphans

      - name: Guardar resultados XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: |
            junit-reports/backend.xml
            junit-reports/playwright-store.xml
            junit-reports/playwright-matrix.xml
          if-no-files-found: ignore

      - name: Registrar resumen y resultados individuales en OpenObserve
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          OPENOBSERVE_URL: ${{ secrets.OPENOBSERVE_URL }}
          OPENOBSERVE_EMAIL: ${{ secrets.OPENOBSERVE_EMAIL }}
          OPENOBSERVE_PASSWORD: ${{ secrets.OPENOBSERVE_PASSWORD }}
          OPENOBSERVE_ORG: ${{ vars.OPENOBSERVE_ORG || 'default' }}
          OPENOBSERVE_STREAM: ${{ vars.OPENOBSERVE_STREAM || 'ci_cd' }}
        run: |
          python scripts/report_pipeline.py \
            --event test_run \
            --outcome "${{ steps.reporter_tests.outcome }}" \
            --outcome "${{ steps.backend_tests.outcome }}" \
            --outcome "${{ steps.frontend_build.outcome }}" \
            --outcome "${{ steps.test_stack.outcome }}" \
            --outcome "${{ steps.playwright_tests.outcome }}" \
            --outcome "${{ steps.test_stack_cleanup.outcome }}" \
            --junit-dir junit-reports \
            --expected-junit-file backend.xml \
            --expected-junit-file playwright-store.xml \
            --expected-junit-file playwright-matrix.xml \
            --require-http-metrics

  deploy:
    name: Desplegar en EC2
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.tests.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Descargar frontend probado
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: deployment-dist

      - name: Verificar configuración de SSM y EC2
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID || 'i-08dced4f3e3520c72' }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          for name in AWS_DEPLOY_ROLE_ARN AWS_REGION EC2_INSTANCE_ID EC2_HOST EC2_USER EC2_SSH_KEY EC2_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "Falta configurar $name en GitHub Actions."
              exit 1
            fi
          done
          if [[ ! "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]{8}([0-9a-f]{9})?$ ]]; then
            echo "EC2_INSTANCE_ID tiene un formato inválido." >&2
            exit 1
          fi

      - name: Obtener credenciales AWS mediante OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
          role-session-name: compra-juegos-${{ github.run_id }}

      - name: Verificar que EC2 está conectado a SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID || 'i-08dced4f3e3520c72' }}
        run: |
          ping_status=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)
          if [ "$ping_status" != "Online" ]; then
            echo "EC2 no está Online en Systems Manager (estado: $ping_status)." >&2
            exit 1
          fi

      - name: Preparar SSH sobre Session Manager
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID || 'i-08dced4f3e3520c72' }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          if ! command -v session-manager-plugin >/dev/null 2>&1; then
            curl --fail --silent --show-error --location \
              https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb \
              --output /tmp/session-manager-plugin.deb
            sudo dpkg -i /tmp/session-manager-plugin.deb
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host ec2-ssm
              HostName $EC2_INSTANCE_ID
              User $EC2_USER
              IdentityFile ~/.ssh/id_ed25519
              IdentitiesOnly yes
              ProxyCommand aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p
              HostKeyAlias $EC2_HOST
              UserKnownHostsFile ~/.ssh/known_hosts
              StrictHostKeyChecking yes
              BatchMode yes
          EOF
          chmod 600 ~/.ssh/config
          session-manager-plugin --version

      - name: Empaquetar versión probada
        run: |
          git archive --format=tar HEAD | gzip -n > compra-juegos.tar.gz
          mkdir -p deployment-context/dist/compra-juegos/browser
          cp -R deployment-dist/. deployment-context/dist/compra-juegos/browser/
          tar -czf frontend-dist.tar.gz -C deployment-context dist

      - name: Actualizar contenedores en EC2
        id: deployment
        env:
          EC2_APP_DIR: ${{ vars.EC2_APP_DIR || '/opt/compra-juegos' }}
        run: |
          case "$EC2_APP_DIR" in
            /*) ;;
            *) echo "EC2_APP_DIR debe ser una ruta absoluta."; exit 1 ;;
          esac
          ssh ec2-ssm "mkdir -p '$EC2_APP_DIR/releases'"
          scp compra-juegos.tar.gz "ec2-ssm:$EC2_APP_DIR/release-$GITHUB_SHA.tar.gz"
          scp frontend-dist.tar.gz "ec2-ssm:$EC2_APP_DIR/frontend-$GITHUB_SHA.tar.gz"
          ssh ec2-ssm bash -s -- "$EC2_APP_DIR" "$GITHUB_SHA" <<'REMOTE'
          set -eu
          app_dir=$1
          release_sha=$2
          release="$app_dir/releases/$release_sha"
          mkdir -p "$release"
          tar -xzf "$app_dir/release-$release_sha.tar.gz" -C "$release"
          tar -xzf "$app_dir/frontend-$release_sha.tar.gz" -C "$release"
          rm "$app_dir/release-$release_sha.tar.gz"
          rm "$app_dir/frontend-$release_sha.tar.gz"
          cd "$app_dir"
          compose=(docker compose --project-name compra-juegos --env-file "$app_dir/.env" --file "$release/compose.yaml")
          "${compose[@]}" pull caddy openobserve otel-collector web cpu-temp-estimator
          legacy_containers=(api-proxy api-blue api-green webapp-container)
          stopped_containers=()
          restore_legacy() {
            if [ "${#stopped_containers[@]}" -eq 0 ]; then return; fi
            if ! "${compose[@]}" down; then
              echo "No se pudo detener la nueva pila durante la restauración." >&2
            fi
            for container in "${stopped_containers[@]}"; do
              if ! docker start "$container"; then
                echo "No se pudo restaurar el contenedor previo $container." >&2
              fi
            done
          }
          for container in "${legacy_containers[@]}"; do
            if docker inspect "$container" >/dev/null 2>&1 && [ "$(docker inspect -f '{{.State.Running}}' "$container")" = true ]; then
              if ! docker stop "$container"; then
                restore_legacy
                exit 1
              fi
              stopped_containers+=("$container")
            fi
          done
          if ! "${compose[@]}" build api; then
            restore_legacy
            exit 1
          fi
          if ! "${compose[@]}" up -d --no-build --remove-orphans; then
            if ! "${compose[@]}" logs; then
              echo "No se pudieron leer los logs de Compose." >&2
            fi
            restore_legacy
            exit 1
          fi
          collector_running=false
          for attempt in $(seq 1 10); do
            collector_id=$("${compose[@]}" ps -q otel-collector)
            if [ -n "$collector_id" ] &&
              [ "$(docker inspect -f '{{.State.Running}}' "$collector_id")" = true ] &&
              [ "$(docker inspect -f '{{.RestartCount}}' "$collector_id")" -eq 0 ]; then
              collector_running=true
              break
            fi
            sleep 2
          done
          if [ "$collector_running" != true ]; then
            if ! "${compose[@]}" logs otel-collector; then
              echo "No se pudieron leer los logs del Collector." >&2
            fi
            restore_legacy
            exit 1
          fi
          estimator_running=false
          for attempt in $(seq 1 10); do
            estimator_id=$("${compose[@]}" ps -q cpu-temp-estimator)
            if [ -n "$estimator_id" ] &&
              [ "$(docker inspect -f '{{.State.Running}}' "$estimator_id")" = true ] &&
              [ "$(docker inspect -f '{{.RestartCount}}' "$estimator_id")" -eq 0 ]; then
              estimator_running=true
              break
            fi
            sleep 2
          done
          if [ "$estimator_running" != true ]; then
            if ! "${compose[@]}" logs cpu-temp-estimator; then
              echo "No se pudieron leer los logs del estimador de temperatura sintética." >&2
            fi
            restore_legacy
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if "${compose[@]}" exec -T api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          if ! "${compose[@]}" logs; then
            echo "No se pudieron leer los logs de Compose." >&2
          fi
          restore_legacy
          exit 1
          REMOTE

      - name: Verificar HTTPS público
        id: public_https
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 10 https://tienda-videojuegos.duckdns.org/api/health >/dev/null &&
              curl --fail --silent --max-time 10 https://obs-videojuegos.duckdns.org/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "No se pudieron validar ambos dominios por HTTPS." >&2
          exit 1

      - name: Restaurar servicios anteriores si falla HTTPS
        if: steps.public_https.outcome == 'failure'
        env:
          EC2_APP_DIR: ${{ vars.EC2_APP_DIR || '/opt/compra-juegos' }}
        run: |
          ssh ec2-ssm bash -s -- "$EC2_APP_DIR" "$GITHUB_SHA" <<'REMOTE'
          set -eu
          app_dir=$1
          release_sha=$2
          release="$app_dir/releases/$release_sha"
          compose=(docker compose --project-name compra-juegos --env-file "$app_dir/.env" --file "$release/compose.yaml")
          if ! "${compose[@]}" down; then
            echo "No se pudo detener la nueva pila antes de restaurar." >&2
          fi
          failed=false
          for container in api-proxy api-blue api-green webapp-container; do
            if docker inspect "$container" >/dev/null 2>&1 && [ "$(docker inspect -f '{{.State.Running}}' "$container")" = false ]; then
              if ! docker start "$container"; then
                echo "No se pudo restaurar el contenedor previo $container." >&2
                failed=true
              fi
            fi
          done
          if [ "$failed" = true ]; then exit 1; fi
          REMOTE

      - name: Registrar despliegue en OpenObserve
        if: always()
        env:
          OPENOBSERVE_URL: ${{ secrets.OPENOBSERVE_URL }}
          OPENOBSERVE_EMAIL: ${{ secrets.OPENOBSERVE_EMAIL }}
          OPENOBSERVE_PASSWORD: ${{ secrets.OPENOBSERVE_PASSWORD }}
          OPENOBSERVE_ORG: ${{ vars.OPENOBSERVE_ORG || 'default' }}
          OPENOBSERVE_STREAM: ${{ vars.OPENOBSERVE_STREAM || 'ci_cd' }}
        run: |
          python scripts/report_pipeline.py \
            --event deployment \
            --outcome "${{ needs.tests.result }}" \
            --outcome "${{ steps.deployment.outcome }}"
